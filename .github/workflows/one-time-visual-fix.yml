name: One-time Visual Fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply only requested visual fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # IranianChat homepage: move bac3 inside the footer, as its final element.
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          marker = '<div class="iranianchat-bac3-footer" aria-hidden="true"></div>'
          html = html.replace(marker, '')
          footer_close = '</footer>'
          if marker not in html:
              html = html.replace(footer_close, marker + footer_close, 1)
          path.write_text(html, encoding='utf-8')

          # Chatiha: make b1.png remain at 15% visible strength.
          for filename in ['chatiha/index.html', '.github/workflows/chatiha-login-fix.yml']:
              p = Path(filename)
              text = p.read_text(encoding='utf-8')
              text = text.replace(
                  'linear-gradient(rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0.5))',
                  'linear-gradient(rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0.85))'
              )
              p.write_text(text, encoding='utf-8')
          PY

      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/one-time-visual-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html chatiha/index.html .github/workflows/chatiha-login-fix.yml .github/workflows/one-time-visual-fix.yml
          git diff --cached --quiet || (git commit -m 'fix: footer decoration and chatiha background visibility' && git push)
