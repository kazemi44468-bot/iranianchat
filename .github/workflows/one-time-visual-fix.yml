name: One-time Footer Fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep footer decoration inside footer at the bottom
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          marker = '<div class="iranianchat-bac3-footer" aria-hidden="true"></div>'
          html = html.replace(marker, '')
          html = html.replace('</div></footer>', marker + '</div></footer>', 1)
          path.write_text(html, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'fix: keep bac3 inside footer at bottom' && git push)
