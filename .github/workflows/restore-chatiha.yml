name: Restore Chatiha
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/restore-chatiha.yml']
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore page from archive
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('chatiha/index.html')
          old=Path('chatiha/index-v4.html')
          if not old.exists(): raise SystemExit('archive missing')
          s=p.read_text(encoding='utf-8')
          a=old.read_text(encoding='utf-8')
          # Preserve the current enhanced page if it contains the real app shell.
          # Only restore if the current file was accidentally truncated.
          if len(s)<10000 or '<body>' not in s or ('app' not in s and 'auth' not in s):
              p.write_text(a,encoding='utf-8')
          PY
      - name: Remove accidental placeholder if needed
        shell: bash
        run: |
          git status --short
          git add chatiha/index.html
          git diff --cached --quiet || git commit -m 'Restore complete Chatiha login and app page'
          git push
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git rm -f .github/workflows/restore-chatiha.yml || true
          git config user.name github-actions
          git config user.email github-actions@github.com
          git diff --cached --quiet || git commit -m 'Remove temporary restore workflow'
          git push || true
