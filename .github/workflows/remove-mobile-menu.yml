name: Remove IranianChat mobile menu
on:
  push:
    paths:
      - '.github/workflows/remove-mobile-menu.yml'
jobs:
  remove:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove mobile menu from main index
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'<button class="mobile-menu"[^>]*>.*?</button>', '', s, flags=re.S)
          s = re.sub(r'<div class="wrap mobile-panel" id="mobilePanel">.*?</div>', '', s, flags=re.S)
          s = re.sub(r'\n\s*\.mobile-menu\s*\{.*?\}\n', '\n', s, flags=re.S)
          s = re.sub(r'\n\s*\.mobile-panel\s*\{.*?\}\n', '\n', s, flags=re.S)
          s = re.sub(r'\n\s*\.mobile-panel\.open\s*\{.*?\}\n', '\n', s, flags=re.S)
          s = re.sub(r'\n\s*\.mobile-panel a\s*\{.*?\}\n', '\n', s, flags=re.S)
          s = re.sub(r'\n\s*\.mobile-menu\s*\{[^{}]*\}\n', '\n', s)
          p.write_text(s, encoding='utf-8')
      - name: Commit removal and delete workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Remove IranianChat mobile menu' || true
          git rm .github/workflows/remove-mobile-menu.yml
          git commit -m 'Remove temporary mobile menu workflow'
          git push
