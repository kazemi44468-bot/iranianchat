name: Fix Chatiha visuals
on:
  push:
    paths:
      - '.github/workflows/fix-chatiha-visuals.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Improve login and in-app views
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('chatiha/index.html')
          s=p.read_text(encoding='utf-8')

          # Use the Persian font files that actually exist in the repository.
          s=s.replace("@font-face{font-family:Vazir;src:url('../assets/fonts/Vazir.woff2')}", "@font-face{font-family:Vazir;src:url('../assets/fonts/Vazir.woff') format('woff');font-style:normal;font-weight:400;font-display:swap}")
          s=s.replace("@font-face{font-family:Vazir;src:url('../assets/fonts/Vazir-Bold.woff2');font-weight:700}", "@font-face{font-family:Vazir;src:url('../assets/fonts/Vazir-Bold.woff') format('woff');font-style:normal;font-weight:700;font-display:swap}")
          s=s.replace("button,input{font:inherit}", "button,input{font:inherit;font-family:Vazir,Tahoma,sans-serif}")

          # Keep the original login photo tiled instead of stretching/cropping it.
          s=s.replace(".auth{min-height:100svh;display:grid;place-items:center;padding:20px;background:url('../assets/images/bg-body.png') center/cover fixed no-repeat}", ".auth{min-height:100svh;display:grid;place-items:center;padding:20px;background-image:url('../assets/images/bg-body.png');background-repeat:repeat;background-size:auto;background-position:top right}")

          # Make secondary product pages live inside the desktop app frame, not as a full-screen overlay.
          s=s.replace(".view{display:none;position:absolute;inset:0;background:var(--bg);z-index:20}", ".view{display:none;position:fixed;top:0;right:383px;bottom:0;left:291px;background:var(--bg);z-index:20;box-shadow:-12px 0 35px rgba(35,58,90,.06)}")
          s=s.replace(".view.open{display:block}", ".view.open{display:block}")
          s=s.replace(".viewhead{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 18px}", ".viewhead{height:68px;background:rgba(255,255,255,.98);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 18px;position:relative}.viewhead:after{content:'';position:absolute;left:18px;right:18px;bottom:0;height:2px;background:linear-gradient(90deg,transparent,var(--p),transparent);opacity:.16}")
          s=s.replace(".viewbody{padding:20px;overflow:auto;height:calc(100% - 68px)}", ".viewbody{padding:20px;overflow:auto;height:calc(100% - 68px);background:linear-gradient(180deg,#f8faff 0,#f5f8fc 100%)}")
          s=s.replace(".feature:hover{border-color:#cbd9ef;transform:translateY(-1px)}", ".feature:hover{border-color:#bcd0ef;transform:translateY(-2px);box-shadow:0 12px 28px rgba(35,58,90,.08)}")

          # Responsive central-pane sizing.
          s=s.replace("@media(max-width:1200px){.app{grid-template-columns:68px 295px minmax(0,1fr)}.details{display:none}}", "@media(max-width:1200px){.app{grid-template-columns:68px 295px minmax(0,1fr)}.details{display:none}.view{right:364px;left:0}}")
          s=s.replace("@media(max-width:850px){.app{grid-template-columns:60px 260px minmax(0,1fr)}.cards{grid-template-columns:1fr 1fr}}", "@media(max-width:850px){.app{grid-template-columns:60px 260px minmax(0,1fr)}.cards{grid-template-columns:1fr 1fr}.view{right:321px;left:0}}")
          s=s.replace("@media(max-width:680px){html,body{overflow:hidden}.auth{padding:14px}", "@media(max-width:680px){html,body{overflow:hidden}.auth{padding:14px}")
          s=s.replace(".viewbody{padding:12px}.grid2", ".view{right:0;left:0;box-shadow:none}.viewbody{padding:12px}.grid2")

          # Replace remaining non-Persian glyph feature icons with consistent labels.
          replacements={
            '>✦</div><b>دستیار هوشمند':'><span>هوش</span></div><b>دستیار هوشمند',
            '>◉</div><b>استوری‌ها':'><span>است</span></div><b>استوری‌ها',
            '>#</div><b>کانال‌ها':'><span>کان</span></div><b>کانال‌ها',
            '>▣</div><b>صفحات عمومی':'><span>صف</span></div><b>صفحات عمومی',
            '>◎</div><b>گروه‌ها':'><span>گرو</span></div><b>گروه‌ها',
            '>☎</div><b>تماس صوتی':'><span>صوت</span></div><b>تماس صوتی',
            '>↺</div><b>اخیر':'><span>اخیر</span></div><b>اخیر',
            '>▧</div><b>تصاویر و ویدئو':'><span>رسانه</span></div><b>تصاویر و ویدئو',
            '>▤</div><b>اسناد':'><span>سند</span></div><b>اسناد',
            '>↗</div><b>لینک‌ها':'><span>لینک</span></div><b>لینک‌ها',
            '>✦</div><b>خلاصه گفتگو':'><span>خلاصه</span></div><b>خلاصه گفتگو',
            '>⌕</div><b>جست‌وجوی هوشمند':'><span>جستجو</span></div><b>جست‌وجوی هوشمند',
            '>✓</div><b>استخراج کارها':'><span>کارها</span></div><b>استخراج کارها'
          }
          for a,b in replacements.items():
              s=s.replace(a,b)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chatiha/index.html
          git diff --cached --quiet || git commit -m 'fix(chatiha): improve Persian login and in-app navigation'
          git push