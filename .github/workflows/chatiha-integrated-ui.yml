name: Chatiha Integrated UI
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('chatiha/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('.main{display:flex;flex-direction:column;min-width:0;background:#f7f9fc}', '.main{display:flex;flex-direction:column;min-width:0;background:#f7f9fc;position:relative;overflow:hidden}')
          a=s.find('.view{display:none;position:fixed;')
          b=s.find('.view.open{display:block}',a)
          if a>=0 and b>a:
            s=s[:a]+'.view{display:none;position:absolute;inset:0;background:#f6f9fd;z-index:20;box-shadow:none;overflow:hidden}.view.open{display:block}'+s[b+len('.view.open{display:block}'):]
          s=s.replace('.view{right:364px;left:0}', '.view{inset:0}')
          s=s.replace('.view{right:321px;left:0}', '.view{inset:0}')
          s=s.replace('.view{right:0;left:0;box-shadow:none}', '.view{inset:0;box-shadow:none}')
          old_auth=".auth{min-height:100svh;display:grid;place-items:center;padding:20px;background-image:url('../assets/images/bg-body.png');background-repeat:repeat;background-size:auto;background-position:top right}"
          new_auth=".auth{min-height:100svh;display:grid;place-items:center;padding:20px;background:#f5f8fc;position:relative;isolation:isolate;overflow:hidden}.auth:before{content:'';position:absolute;inset:0;background:url('../assets/images/bg-body.png') repeat;background-position:top right;opacity:.15;pointer-events:none;z-index:0}"
          s=s.replace(old_auth,new_auth)
          s=s.replace('.authbox{width:min(450px,100%);text-align:center}', '.authbox{width:min(450px,100%);text-align:center;position:relative;z-index:1}')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chatiha/index.html
          git diff --cached --quiet || (git commit -m "fix(chatiha): keep background at 15 percent" && git push)
