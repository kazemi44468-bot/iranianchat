name: One-time Ertebasan visual alignment
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Ertebasan
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ertebasan/index.html')
          s=p.read_text(encoding='utf-8')
          css='''<style id="ertebasan-chatiha-visual">html,body{width:100%;height:100%;overflow:hidden}.auth-gate{position:fixed;inset:0;width:100%;height:100svh;padding:0;overflow:hidden;justify-content:space-between;flex-direction:column;gap:0;background-image:linear-gradient(rgba(255,255,255,.85),rgba(255,255,255,.85)),url('../assets/images/b1.png'),linear-gradient(135deg,#f7fbff,#eef6ff 48%,#f8fbff);background-repeat:repeat,repeat,repeat;background-position:left top;background-size:auto,200px 103px,auto}.auth-card{flex:0 1 auto;max-height:calc(100svh - 92px);overflow:auto}.auth-bac3{display:block;width:100%;height:46px;min-height:46px;flex:0 0 46px;background-image:url('../assets/images/bac3.png');background-repeat:repeat-x;background-position:center top;background-size:484px 46px}.auth-bac3.bottom{transform:rotate(180deg)}.auth-gate .auth-bac3{position:relative;z-index:2}.auth-visual .auth-logo{width:124px;height:124px;border-radius:0;overflow:visible;margin:0 auto 24px;align-self:center;box-shadow:none;background:transparent}.auth-visual .auth-logo img{display:block;width:100%;height:100%;object-fit:contain}.auth-visual{text-align:center}.auth-visual p{margin-left:auto;margin-right:auto}.auth-features{grid-template-columns:repeat(3,1fr);gap:9px}.auth-feature{justify-content:center;text-align:center;min-height:58px;flex-direction:column;gap:4px}@media(max-width:760px){.auth-gate{padding:0}.auth-card{width:100%;max-height:calc(100svh - 92px);border-radius:20px}.auth-visual{padding:20px 18px 16px}.auth-visual .auth-logo{width:100px;height:100px;margin:0 auto 12px}.auth-visual h1{font-size:21px}.auth-visual p{font-size:9px;line-height:1.9;max-width:330px;margin:0 auto 10px}.auth-features{grid-template-columns:repeat(3,1fr);gap:5px}.auth-feature{display:flex!important;min-height:48px;padding:6px 4px;font-size:8px}.auth-feature i{font-size:18px}}@media(max-width:390px){.auth-bac3{background-size:484px 46px}.auth-card{max-height:calc(100svh - 80px)}.auth-visual .auth-logo{width:94px;height:94px}.auth-visual h1{font-size:19px}.auth-visual p{font-size:8px}.auth-feature{font-size:7px;padding:5px}}</style>'''
          if 'ertebasan-chatiha-visual' not in s: s=s.replace('</head>',css+'</head>',1)
          s=s.replace('ارتباطات صوتی، تصویری و متنی در یک فضای یکپارچه.','ارتباسان؛ شبکه‌ای برای ارتباط آسان و امن، با تجربه‌ای یکپارچه برای تماس‌های صوتی، تصویری و ارتباطات متنی.')
          s=s.replace('تماس صوتی','ارتباط صوتی').replace('تماس تصویری','ارتباط تصویری').replace('تماس متنی','ارتباط متنی')
          s=s.replace('ورود به چتی‌ها','ورود به ارتباسان').replace('شرایط استفاده و حریم خصوصی چتی‌ها','شرایط استفاده و حریم خصوصی ارتباسان').replace('حساب چتی‌ها ساخته شود','حساب ارتباسان ساخته شود')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ertebasan/index.html
          git rm .github/workflows/one-time-ertebasan-visual.yml
          git commit -m "Align Ertebasan visual style with Chatiha"
          git push
