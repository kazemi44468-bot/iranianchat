name: Add product links
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Add Chatiha and Ertebasan links
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<div class="iranianchat-main-products">'
          if marker not in s:
              insert = '''\n    <section class="iranianchat-main-products section" aria-label="محصولات ارتباطی ایرانیان چت">\n      <div class="wrap">\n        <div class="head">\n          <div class="kicker">محصولات ارتباطی</div>\n          <h2>دو مسیر برای ارتباط بهتر</h2>\n          <p>از پیام‌رسانی عمومی تا شبکه ارتباطی آسان و امن، مسیر مناسب خودتان را انتخاب کنید.</p>\n        </div>\n        <div class="iranianchat-main-products-grid">\n          <a class="iranianchat-main-product chatiha-product" href="chatiha/">\n            <span class="product-badge">چتی‌ها</span>\n            <strong>شبکه پیام‌رسانی عمومی</strong>\n            <span>پیام‌رسان عمومی برای گفتگو، گروه‌ها، کانال‌ها و ارتباطات روزمره.</span>\n            <b>ورود به چتی‌ها ←</b>\n          </a>\n          <a class="iranianchat-main-product ertebasan-product" href="ertebasan/">\n            <span class="product-badge">ارتباسان</span>\n            <strong>شبکه ارتباطی آسان و امن</strong>\n            <span>فضایی ساده، سریع و امن برای ارتباطات فردی، گروهی و اختصاصی.</span>\n            <b>ورود به ارتباسان ←</b>\n          </a>\n        </div>\n      </div>\n    </section>\n'''
              pos = s.find('<section class="showcase">')
              if pos == -1:
                  raise SystemExit('showcase section not found')
              s = s[:pos] + insert + s[pos:]
              css = '''\n<style id="iranianchat-main-products-style">\n.iranianchat-main-products{padding:25px 0 60px}.iranianchat-main-products-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;max-width:900px;margin:auto}.iranianchat-main-product{position:relative;display:flex;flex-direction:column;gap:8px;min-height:205px;padding:28px;border:1px solid #dce8f4;border-radius:24px;background:linear-gradient(145deg,#fff,#f4f9ff);box-shadow:0 18px 45px #24527b12;transition:.25s;overflow:hidden}.iranianchat-main-product:before{content:"";position:absolute;width:150px;height:150px;border-radius:50%;left:-45px;bottom:-70px;background:#5ba6ff18}.iranianchat-main-product:hover{transform:translateY(-4px);box-shadow:0 24px 55px #24527b1c}.iranianchat-main-product .product-badge{position:relative;width:max-content;padding:5px 10px;border-radius:999px;background:#eaf3ff;color:#2478ef;font-size:11px;font-weight:900}.iranianchat-main-product strong{position:relative;font-size:21px;color:#15243d}.iranianchat-main-product>span:not(.product-badge){position:relative;color:#71829a;font-size:11px;line-height:2;max-width:430px}.iranianchat-main-product b{position:relative;margin-top:auto;color:#2478ef;font-size:11px}.ertebasan-product{background:linear-gradient(145deg,#fff,#f2f0ff)}.ertebasan-product .product-badge{background:#f0edff;color:#8065f4}.ertebasan-product b{color:#8065f4}@media(max-width:760px){.iranianchat-main-products-grid{grid-template-columns:1fr}.iranianchat-main-product{min-height:175px;padding:22px}.iranianchat-main-product strong{font-size:18px}}\n</style>\n'''
              s = s.replace('</head>', css + '</head>', 1)
              p.write_text(s, encoding='utf-8')
          else:
              print('links already present')
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then git commit -m "Add Chatiha and Ertebasan links"; fi
          git rm .github/workflows/add-product-links.yml
          git commit -m "Remove temporary update workflow"
          git push