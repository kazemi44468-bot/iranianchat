name: Patch Chatiha profiles
on:
  push:
    paths:
      - '.github/workflows/patch-chatiha-profiles.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply UI patch
        shell: python
        run: |
          from pathlib import Path
          p=Path('chatiha/index.html')
          s=p.read_text(encoding='utf-8')
          old="background-image:url('../assets/images/bg-body.png');background-size:cover;background-position:center;opacity:.075"
          new="background-image:url('../assets/images/bg-body.png');background-repeat:repeat;background-size:auto;background-position:top right;opacity:.075"
          s=s.replace(old,new,1)
          css='''/* پروفایل‌های متمایز گفتگوها */.chat .avatar{overflow:hidden}.chat .avatar img{width:100%;height:100%;object-fit:cover;display:block}.chat .avatar .online{z-index:2}.chat-meta{display:flex;align-items:center;gap:5px;margin-top:4px;min-width:0}.chat-status{font-size:8px;color:var(--green);white-space:nowrap}.chat-bio{font-size:8px;color:#8A97A5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat-verified{display:inline-flex;align-items:center;gap:2px;color:var(--blue);font-size:8px;white-space:nowrap}.chat-verified .svg{width:10px;height:10px}.chat:hover .avatar,.chat.active .avatar{box-shadow:0 7px 18px rgba(36,107,254,.15)}'''
          if '/* پروفایل‌های متمایز گفتگوها */' not in s:
            s=s.replace('</style>',css+'</style>',1)
          js='''<script>document.addEventListener('DOMContentLoaded',()=>{const data={'تیم محصول':['تیم محصول و تجربه کاربری','۱۲ عضو فعال'],'سارا احمدی':['طراح تجربه و رابط کاربری','آنلاین'],'اساتید پورتال':['پروژه پلتفرم اساتید','۸ عضو فعال'],'گروه توسعه محصول':['توسعه و زیرساخت','۵ عضو فعال'],'اخبار فناوری':['کانال رسمی فناوری','به‌روزرسانی امروز']};document.querySelectorAll('.chat').forEach(c=>{const n=c.querySelector('.name');if(!n||!data[n.textContent.trim()])return;const name=n.textContent.trim();const a=c.querySelector('.avatar');if(a&&!a.querySelector('img')){a.innerHTML='<img src="../assets/images/logo.png" alt="'+name+'"><span class="online"></span>'}if(!c.querySelector('.chat-verified')){const v=document.createElement('span');v.className='chat-verified';v.innerHTML='<svg class="svg" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg>تأییدشده';n.parentElement.appendChild(v)}const last=c.querySelector('.last');if(last&&!c.querySelector('.chat-meta')){const m=document.createElement('div');m.className='chat-meta';m.innerHTML='<span class="chat-status">'+data[name][1]+'</span><span class="chat-bio">'+data[name][0]+'</span>';last.insertAdjacentElement('afterend',m)}});});</script>'''
          if 'data-name="چتی‌ها-profile-patch"' not in s:
            js=js.replace('<script>','<script data-name="چتی‌ها-profile-patch">',1)
            s=s.replace('</body>',js+'</body>',1)
          p.write_text(s,encoding='utf-8')
      - name: Commit UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chatiha/index.html
          git commit -m "Improve Chatiha login background and chat identities" || true
          git push
      - name: Remove patch workflow
        if: always()
        run: |
          rm -f .github/workflows/patch-chatiha-profiles.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/patch-chatiha-profiles.yml
          git diff --cached --quiet || git commit -m "Remove temporary Chatiha patch workflow"
          git push || true
