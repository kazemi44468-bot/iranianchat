name: Enhance Chatiha profiles
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch Chatiha
        shell: python
        run: |
          from pathlib import Path
          p=Path('chatiha/index.html')
          s=p.read_text(encoding='utf-8')
          old="background-image:url('../assets/images/bg-body.png');background-size:cover;background-position:center;opacity:.075"
          new="background-image:url('../assets/images/bg-body.png');background-repeat:repeat;background-size:auto;background-position:top right;opacity:.075"
          if old not in s:
            raise SystemExit('login background target not found')
          s=s.replace(old,new,1)
          marker='/* پروفایل‌های متمایز گفتگوها */'
          css="""\n/* پروفایل‌های متمایز گفتگوها */.chat .avatar{overflow:hidden}.chat .avatar img{width:100%;height:100%;object-fit:cover;display:block}.chat .avatar .online{z-index:2}.chat-meta{display:flex;align-items:center;gap:5px;margin-top:4px;min-width:0}.chat-status{font-size:8px;color:var(--green);white-space:nowrap}.chat-bio{font-size:8px;color:#8A97A5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat-verified{display:inline-flex;align-items:center;gap:2px;color:var(--blue);font-size:8px;white-space:nowrap}.chat-verified .svg{width:10px;height:10px}.chat:hover .avatar,.chat.active .avatar{box-shadow:0 7px 18px rgba(36,107,254,.15)}\n"""
          if marker not in s:
            s=s.replace('</style>',css+'</style>',1)
          old_block='''<div class="chat active"'''
          if old_block not in s:
            raise SystemExit('chat list target not found')
          import re
          # Add data-driven visual profile treatment to existing avatar nodes without deleting the existing chat list.
          names=[('تیم محصول','../assets/images/logo.png','تیم محصول و تجربه کاربری','۱۲ عضو فعال'),('سارا احمدی','../assets/images/logo.png','طراح تجربه و رابط کاربری','آنلاین'),('اساتید پورتال','../assets/images/logo.png','پروژه پلتفرم اساتید','۸ عضو فعال'),('گروه توسعه محصول','../assets/images/logo.png','توسعه و زیرساخت','۵ عضو فعال'),('اخبار فناوری','../assets/images/logo.png','کانال رسمی فناوری','به‌روزرسانی امروز')]
          for name,src,bio,status in names:
            pat=r'(<div class="chat(?: active)?"[^>]*>\s*<div class="avatar[^>]*>)(.*?)(</div>\s*<div class="chatinfo"[^>]*>\s*<div class="top">\s*<span class="name">)'+re.escape(name)+r'(</span>)'
            def repl(m):
              inner=f'<img src="{src}" alt="{name}"><span class="online"></span>'
              tail=f'{m.group(4)}<span class="chat-verified"><svg class="svg" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg>تأییدشده</span>'
              return m.group(1)+inner+m.group(3)+tail+m.group(5)
            s,n=re.subn(pat,repl,s,count=1,flags=re.S)
            if n:
              # Insert a compact bio/status line after the first last-message element in this chat item.
              start=s.find(f'<span class="name">{name}</span>')
              if start>=0:
                end=s.find('</div>',s.find('<div class="top">',start))
                if end>=0:
                  # Find the chat's last line and append metadata after it.
                  last=s.find('<div class="last">',end)
                  if last>=0:
                    lend=s.find('</div>',last)
                    if lend>=0:
                      s=s[:lend+6]+f'<div class="chat-meta"><span class="chat-status">{status}</span><span class="chat-bio">{bio}</span></div>'+s[lend+6:]
          p.write_text(s,encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chatiha/index.html
          git commit -m "Enhance Chatiha login background and chat profiles" || exit 0
          git push
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/enhance-chatiha-profiles.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/enhance-chatiha-profiles.yml
          git diff --cached --quiet || git commit -m "Remove temporary enhancement workflow"
          git push || true
