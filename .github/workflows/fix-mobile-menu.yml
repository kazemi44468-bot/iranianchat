name: Fix IranianChat mobile menu
on:
  push:
    paths:
      - '.github/workflows/fix-mobile-menu.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch mobile menu
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='''      .mobile-panel {\n        position: absolute;\n        top: 72px;\n        right: 12px;\n        left: 12px;\n        width: auto;\n        padding: 9px;\n        background: #fffffff7;\n        border: 1px solid var(--line);\n        border-radius: 18px;\n        box-shadow: 0 18px 45px #24527b1c;\n        backdrop-filter: blur(18px);\n        z-index: 70\n      }'''
          new='''      .mobile-panel {\n        position: fixed !important;\n        top: auto !important;\n        right: 12px !important;\n        left: 12px !important;\n        bottom: 16px !important;\n        width: auto !important;\n        max-height: min(68vh, 520px);\n        overflow-y: auto;\n        padding: 8px;\n        background: #fffffff7;\n        border: 1px solid var(--line);\n        border-radius: 20px;\n        box-shadow: 0 22px 55px #24527b24;\n        backdrop-filter: blur(20px);\n        z-index: 1000;\n        overscroll-behavior: contain\n      }'''
          if old not in s:
              raise SystemExit('target CSS block not found')
          s=s.replace(old,new,1)
          marker='''      .mobile-panel.open {\n        display: block\n      }'''
          replacement='''      .mobile-panel.open {\n        display: block\n        ;animation: iranianchatMobilePanelIn .2s ease-out both\n      }\n\n      @keyframes iranianchatMobilePanelIn {\n        from { opacity: 0; transform: translateY(10px) scale(.985) }\n        to { opacity: 1; transform: translateY(0) scale(1) }\n      }'''
          if marker not in s:
              raise SystemExit('open block not found')
          s=s.replace(marker,replacement,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and clean workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix IranianChat mobile menu placement" || true
          git rm .github/workflows/fix-mobile-menu.yml || true
          git commit -m "Remove temporary mobile menu workflow" || true
          git push origin main