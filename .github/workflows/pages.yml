name: Deploy IranianChat
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Repair Chatiha UI before deployment
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('chatiha/index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'\s*<div class="chatiha-auth-gallery"[^>]*>.*?</div>\s*', '\n', s, count=1, flags=re.S)
          gallery = '''\n      <section class="chatiha-app-gallery" aria-label="تصاویر چتی‌ها">\n        <div class="chatiha-app-gallery-head"><b>چتی‌ها</b><span>فضای ارتباطی ایرانیان چت</span></div>\n        <div class="chatiha-app-gallery-grid">\n          <a href="../assets/images/pic1.png" target="_blank" rel="noopener"><img src="../assets/images/pic1.png" alt="چتی‌ها ۱"></a>\n          <a href="../assets/images/pic2.png" target="_blank" rel="noopener"><img src="../assets/images/pic2.png" alt="چتی‌ها ۲"></a>\n          <a href="../assets/images/pic3.png" target="_blank" rel="noopener"><img src="../assets/images/pic3.png" alt="چتی‌ها ۳"></a>\n        </div>\n      </section>\n'''
          s = re.sub(r'\s*<section class="chatiha-app-gallery"[^>]*>.*?</section>\s*', '\n', s, count=1, flags=re.S)
          if '</aside>' in s:
              s = s.rsplit('</aside>', 1)[0] + gallery + '    </aside>' + s.rsplit('</aside>', 1)[1]
          style = '''\n<style id="chatiha-gallery-repair">\n.chatiha-auth-gallery{display:none!important}\n.chatiha-app-gallery{margin:12px 13px 13px;padding:10px;border:1px solid var(--line);border-radius:16px;background:#ffffffd9;box-shadow:0 10px 28px #315c8810}\n.chatiha-app-gallery-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;font-size:9px}.chatiha-app-gallery-head b{font-size:11px}.chatiha-app-gallery-head span{color:var(--muted);font-size:8px}\n.chatiha-app-gallery-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.chatiha-app-gallery-grid a{display:block;overflow:hidden;aspect-ratio:1.35;border-radius:11px;border:1px solid var(--line)}.chatiha-app-gallery-grid img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .2s}.chatiha-app-gallery-grid a:hover img{transform:scale(1.04)}\n@media(max-width:1050px){.chatiha-app-gallery{display:none}}\n</style>\n'''
          s = re.sub(r'\s*<style id="chatiha-gallery-repair">.*?</style>\s*', '\n', s, count=1, flags=re.S)
          auth_style = '''\n<style id="chatiha-auth-logo-refinement">\n.auth-visual .auth-logo{width:112px;height:112px;border-radius:30px;margin:0 auto 24px;align-self:center;box-shadow:0 18px 38px #2478ef30}\n.auth-visual .auth-logo img{display:block;width:100%;height:100%;object-fit:cover}\n.auth-visual .auth-visual p{margin-left:auto;margin-right:auto}\n@media(max-width:800px){.auth-visual .auth-logo{width:90px;height:90px;border-radius:25px;margin-bottom:16px}}\n</style>\n'''
          s = re.sub(r'\s*<style id="chatiha-auth-logo-refinement">.*?</style>\s*', '\n', s, count=1, flags=re.S)
          s = s.replace('</head>', style + auth_style + '</head>', 1)
          s = re.sub(r'\s*< script >.*?</script>\s*</script>\s*', '\n</script>\n', s, count=1, flags=re.S)
          s = re.sub(r'\s*<script id="chatiha-interaction-repair">.*?</script>\s*', '\n', s, count=1, flags=re.S)
          s = re.sub(r'\s*n</body>', '\n</body>', s, count=1)
          p.write_text(s, encoding='utf-8')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          footer_brand = '''<div class="footer-brand-block">\n          <div class="footer-brand-lockup"><div class="footer-brand-mark"><img src="assets/images/logo.png" alt="نشان ایرانیان چت"></div><div><div class="footer-brand">ایرانیان چت</div><div class="footer-brand-sub">پیام‌رسان ایرانی، برای ارتباطی امن و ماندگار</div></div></div>\n          <p class="footer-desc">پیام‌رسان سریع، امن و هوشمند با قابلیت‌های اجتماعی و راهکارهای ارتباطی اختصاصی برای سازمان‌ها، شرکت‌ها، دانشگاه‌ها و جوامع.</p>\n        </div>'''
          s = re.sub(r'<div class="footer-brand-block">\s*<div class="footer-brand">ایرانیان چت</div>\s*<p class="footer-desc">.*?</p>\s*</div>', footer_brand, s, count=1, flags=re.S)
          logo_section = '''<section class="iranianchat-minimal-logos" aria-label="نشان‌های مینیمال ایرانیان چت"><div class="section-head"><h2>نشان‌های مینیمال ایرانیان چت</h2><p>دو اجرای ساده از هویت بصری برند، برای استفاده در فضاهای مختلف.</p></div><div class="iranianchat-minimal-logo-grid"><a href="assets/images/logo1.png" target="_blank" rel="noopener"><img src="assets/images/logo1.png" alt="نشان مینیمال ایرانیان چت - طرح اول"><span>نشان مینیمال ۱</span></a><a href="assets/images/logo2.png" target="_blank" rel="noopener"><img src="assets/images/logo2.png" alt="نشان مینیمال ایرانیان چت - طرح دوم"><span>نشان مینیمال ۲</span></a></div></section>'''
          if 'class="iranianchat-minimal-logos"' not in s:
              s = s.replace('<div class="iranianchat-contact" id="contact">', logo_section + '<div class="iranianchat-contact" id="contact">', 1)
          brand_style = '''\n<style id="iranianchat-brand-refinement">\n.footer-brand-block{min-height:188px}.footer-brand-lockup{display:flex;align-items:center;gap:13px}.footer-brand-mark{width:64px;height:64px;flex:none;border-radius:19px;overflow:hidden;background:#fff;border:1px solid #dbe7f2;box-shadow:0 12px 28px #24527b14}.footer-brand-mark img{display:block;width:100%;height:100%;object-fit:cover}.footer-brand{line-height:1.45}.footer-brand-sub{margin-top:2px;color:#7a8ca1;font-size:10px;line-height:1.8}.footer-desc{margin:11px 0 0;line-height:2}.iranianchat-minimal-logos{padding:8px 0 38px}.iranianchat-minimal-logos .section-head{text-align:center;margin-bottom:17px}.iranianchat-minimal-logo-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;max-width:760px;margin:0 auto}.iranianchat-minimal-logo-grid a{min-height:180px;padding:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border:1px solid #dce8f4;border-radius:22px;background:#ffffffe8;box-shadow:0 18px 45px #24527b12;transition:.2s}.iranianchat-minimal-logo-grid a:hover{transform:translateY(-3px);box-shadow:0 22px 50px #24527b18}.iranianchat-minimal-logo-grid img{display:block;width:min(150px,60%);height:110px;object-fit:contain}.iranianchat-minimal-logo-grid span{font-size:10px;font-weight:700;color:#667991}@media(max-width:760px){.footer-brand-block{min-height:auto}.footer-brand-mark{width:58px;height:58px;border-radius:17px}.footer-brand-sub{font-size:9px}.iranianchat-minimal-logo-grid{grid-template-columns:1fr}.iranianchat-minimal-logo-grid a{min-height:160px}.iranianchat-minimal-logo-grid img{height:95px}}\n</style>\n'''
          s = re.sub(r'\s*<style id="iranianchat-brand-refinement">.*?</style>\s*', '\n', s, count=1, flags=re.S)
          s = s.replace('</head>', brand_style + '</head>', 1)
          p.write_text(s, encoding='utf-8')

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html chatiha/index.html
          git diff --cached --quiet || (git commit -m 'fix: refine IranianChat and Chatiha branding' && git push)
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
