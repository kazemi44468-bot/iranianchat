name: Deploy IranianChat
# Temporary persistence step for the requested Chatiha login refinement.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Refine Chatiha login screen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('chatiha/index.html')
          s=p.read_text(encoding='utf-8')
          old='<style id="chatiha-auth-logo-refinement">.auth-visual .auth-logo{width:112px;height:112px;border-radius:30px;margin:0 auto 24px;align-self:center;box-shadow:0 18px 38px #2478ef30}.auth-visual .auth-logo img{display:block;width:100%;height:100%;object-fit:cover}.auth-visual p{margin-left:auto;margin-right:auto}@media(max-width:800px){.auth-visual .auth-logo{width:90px;height:90px;border-radius:25px;margin-bottom:16px}}</style>'
          new='<style id="chatiha-auth-logo-refinement">.auth-visual .auth-logo{width:124px;height:124px;border-radius:0;overflow:visible;margin:0 auto 24px;align-self:center;box-shadow:none;background:transparent}.auth-visual .auth-logo img{display:block;width:100%;height:100%;object-fit:contain}.auth-visual p{margin-left:auto;margin-right:auto}@media(max-width:760px){.auth-gate{padding:8px}.auth-card{width:100%;max-height:calc(100svh - 76px);border-radius:20px}.auth-visual{padding:20px 18px 16px;text-align:center}.auth-visual .auth-logo{width:100px;height:100px;margin:0 auto 12px}.auth-visual h1{font-size:21px;margin-bottom:6px}.auth-visual p{font-size:9px;line-height:1.9;max-width:330px;margin:0 auto 10px}.auth-features{grid-template-columns:repeat(2,1fr);gap:6px;max-width:360px;margin:0 auto}.auth-feature{justify-content:center;min-height:34px;padding:6px 7px}.auth-feature:nth-child(3){display:none}.auth-form{padding:18px 18px 20px}.auth-tabs{margin-bottom:12px}.auth-title{font-size:19px}.auth-sub{font-size:9px;margin-bottom:13px}.auth-field{margin-bottom:9px}.auth-field input{height:42px}.auth-submit{height:44px}.auth-note{font-size:7px;line-height:1.8}.auth-switch{font-size:9px;margin-top:10px}}@media(max-width:390px){.auth-gate{padding:5px}.auth-card{max-height:calc(100svh - 64px);border-radius:18px}.auth-visual{padding:16px 14px 12px}.auth-visual .auth-logo{width:94px;height:94px;margin-bottom:8px}.auth-visual h1{font-size:19px}.auth-visual p{font-size:8px;margin-bottom:8px}.auth-features{grid-template-columns:1fr 1fr;gap:5px}.auth-feature{font-size:7px;padding:5px}.auth-form{padding:15px 14px 17px}}</style>'
          if old not in s: raise SystemExit('target refinement style not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chatiha/index.html
          if ! git diff --cached --quiet; then
            git commit -m "chatiha: refine login logo and mobile layout"
            git push origin HEAD:main
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
