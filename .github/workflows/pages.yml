name: Deploy IranianChat
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply footer logo cleanup only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='.footer-brand-mark{width:128px;height:128px;flex:none;border-radius:28px;overflow:hidden;background:#fff;border:1px solid #dbe7f2;box-shadow:0 12px 28px #24527b14}'
          new='.footer-brand-mark{width:128px;height:128px;flex:none;border-radius:0;overflow:visible;background:transparent;border:0;box-shadow:none}'
          if s.count(old)==1:
              p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit footer source change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- index.html; then exit 0; fi
          git add index.html
          git diff --cached --check
          git commit -m 'chore: cleanup IranianChat footer logo'
          git push
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
