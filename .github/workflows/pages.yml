name: Deploy IranianChat
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply requested footer-only CSS change
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = ".footer-brand-lockup{display:flex;align-items:center;gap:13px}.footer-brand-mark{width:64px;height:64px;flex:none;border-radius:19px;overflow:hidden;background:#fff;border:1px solid #dbe7f2;box-shadow:0 12px 28px #24527b14}.footer-brand-mark img{display:block;width:100%;height:100%;object-fit:cover}"
          new = ".footer-brand-lockup{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}.footer-brand-mark{width:128px;height:128px;flex:none;border-radius:28px;overflow:hidden;background:#fff;border:1px solid #dbe7f2;box-shadow:0 12px 28px #24527b14}.footer-brand-mark img{display:block;width:100%;height:100%;object-fit:cover}.footer-brand-lockup>div:last-child{text-align:center}"
          if s.count(old) != 1:
              raise SystemExit(f'Expected desktop footer CSS exactly once, found {s.count(old)}')
          s = s.replace(old, new, 1)
          old_mobile = ".footer-brand-mark{width:58px;height:58px;border-radius:17px}"
          new_mobile = ".footer-brand-mark{width:116px;height:116px;border-radius:26px}"
          if s.count(old_mobile) != 1:
              raise SystemExit(f'Expected mobile footer CSS exactly once, found {s.count(old_mobile)}')
          s = s.replace(old_mobile, new_mobile, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit footer-only source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "chore: refine IranianChat footer logo"
          git push
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
