name: Deploy IranianChat
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Refine logo display only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = [
            ('.footer-brand-mark img{display:block;width:100%;height:100%;object-fit:cover}', '.footer-brand-mark img{display:block;width:100%;height:100%;object-fit:contain}'),
            ('.footer-brand-mark{width:116px;height:116px;border-radius:26px}', '.footer-brand-mark{width:116px;height:116px;border-radius:0}'),
            ('.iranianchat-brand-img{width:49px;height:49px;display:block;object-fit:cover;border-radius:16px;box-shadow:0 11px 28px #2478ef3b}', '.iranianchat-brand-img{width:49px;height:49px;display:block;object-fit:contain;border-radius:0;box-shadow:none;background:transparent;border:0}'),
          ]
          original = s
          for old, new in replacements:
              s = s.replace(old, new)
          if s == original:
              print('No logo changes needed')
          else:
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit source change
        run: |
          if git diff --quiet -- index.html; then
            echo "No source change"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "chore: refine logo display"
            git push
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
