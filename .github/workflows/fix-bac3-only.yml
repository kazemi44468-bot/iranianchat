name: Fix bac3 footer only

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply only bac3 footer placement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          html = html.replace('padding-bottom: 68px !important;', 'padding-bottom: 18px !important;')
          html = html.replace('transform: none !important;\n      z-index: 2 !important;', 'transform: rotate(180deg) !important;\n      transform-origin: center center !important;\n      z-index: 2 !important;')
          marker = '<div class="iranianchat-bac3-footer" aria-hidden="true"></div>'
          html = html.replace(marker, '')
          html = html.replace('</footer>', marker + '</footer>', 1)
          path.write_text(html, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'fix: position bac3 at footer bottom' && git push)
