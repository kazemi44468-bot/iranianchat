name: Add Ertebasan login gate
on: push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Ertebasan
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ertebasan/index.html
          git commit -m "Add Ertebasan login page with contact options"
          git rm .github/workflows/ertebasan-auth.yml
          git commit -m "Remove temporary Ertebasan auth workflow"
          git push
