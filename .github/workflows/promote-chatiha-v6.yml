name: Promote Chatiha v6
on:
  push:
    paths:
      - 'chatiha/index-v6.html'
      - '.github/workflows/promote-chatiha-v6.yml'
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Promote v6
        run: cp chatiha/index-v6.html chatiha/index.html
      - name: Commit promoted entry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chatiha/index.html
          git diff --cached --quiet || git commit -m 'chore(chatiha): promote v6 to main entry'
          git push