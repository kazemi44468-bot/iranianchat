name: Apply IranianChat header and mobile nav
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='.header-products{display:flex;align-items:center;gap:8px}.header-products .btn{min-height:42px;padding:8px 16px}.header-products .btn:first-child{color:#2478ef;border-color:#cfe2f8;background:#f7fbff}'
          new='.header-products{display:flex;align-items:center;gap:8px}.header-products .btn{min-height:42px;min-width:112px;padding:8px 16px}.header-products .btn.primary,.header-products .btn:first-child{color:#fff;border-color:transparent;background:linear-gradient(135deg,var(--blue),var(--blue2));box-shadow:0 10px 24px #2478ef26}.header-products .btn:hover{box-shadow:0 14px 28px #2478ef30}'
          if old not in s: raise SystemExit('header marker not found')
          s=s.replace(old,new,1)
          css='''
    .mobile-bottom-nav{display:none}
    @media(max-width:760px){
      .header{padding:10px 0 8px}.nav{height:auto;min-height:60px;padding:7px 8px;border-radius:18px;gap:8px}.brand{min-width:0;gap:7px;font-size:15px}.brand small{font-size:8px}.logo{width:40px;height:40px;border-radius:13px;flex:none}.header-products{gap:5px;min-width:0}.header-products .btn{min-width:0;width:clamp(78px,22vw,105px);min-height:38px;padding:7px 8px;border-radius:11px;font-size:11px;white-space:nowrap}.mobile-bottom-nav{position:fixed;display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:center;gap:4px;right:10px;left:10px;bottom:max(9px,env(safe-area-inset-bottom));height:58px;padding:5px 7px;z-index:2147483000;background:#fffffff2;border:1px solid #dce8f4;border-radius:20px;box-shadow:0 14px 40px #24527b1c;backdrop-filter:blur(18px)}.mobile-bottom-nav a{min-width:0;height:46px;display:flex;align-items:center;justify-content:center;gap:5px;border-radius:14px;color:#61748e;font-size:10px;font-weight:800;transition:.2s}.mobile-bottom-nav a:hover,.mobile-bottom-nav a.active{background:#eaf3ff;color:var(--blue)}.mobile-bottom-nav .mobile-home{width:46px;height:46px;margin:auto;padding:4px;border-radius:15px;background:linear-gradient(145deg,var(--blue),#62baff);box-shadow:0 9px 22px #2478ef38}.mobile-bottom-nav .mobile-home img{width:100%;height:100%;object-fit:contain;border-radius:11px}
    }
    @media(max-width:430px){.wrap{width:min(100% - 20px,1160px)}.brand small{display:none}.header-products .btn{width:82px;padding:6px 5px;font-size:10px}.mobile-bottom-nav{right:7px;left:7px;bottom:max(7px,env(safe-area-inset-bottom));border-radius:18px}.mobile-bottom-nav a{font-size:9px}}
'''
          s=s.replace('</style>',css+'</style>',1)
          nav='''
  <nav class="mobile-bottom-nav" aria-label="منوی موبایل">
    <a href="chatiha/" aria-label="چتی‌ها">چتی‌ها</a>
    <a class="mobile-home" href="./" aria-label="خانه"><img src="assets/images/logo.png" alt="ایرانیان چت"></a>
    <a href="ertebasan/" aria-label="ارتباسان">ارتباسان</a>
  </nav>
'''
          if '</body>' not in s: raise SystemExit('body marker not found')
          s=s.replace('</body>',nav+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Refine IranianChat header and mobile nav'
          git rm .github/workflows/apply-header-mobile.yml
          git commit -m 'Remove temporary refinement workflow'
          git push
