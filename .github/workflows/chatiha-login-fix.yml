name: Chatiha Login Fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Move bac3 to the very bottom of IranianChat homepage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          style = """<style id="iranianchat-bac3-footer-style">
          .iranianchat-bac3-footer {
            width: 100%;
            height: 46px;
            min-height: 46px;
            display: block;
            background-image: url('assets/images/bac3.png');
            background-repeat: repeat-x;
            background-position: center top;
            background-size: 484px 46px;
            transform: rotate(180deg);
            transform-origin: center;
          }
          </style>"""

          html = re.sub(
              r'<style id="iranianchat-bac3-footer-style">.*?</style>',
              style,
              html,
              count=1,
              flags=re.S,
          )

          html = re.sub(
              r'<div class="iranianchat-bac3-footer" aria-hidden="true"></div>',
              '',
              html,
          )

          footer_end = '</footer>'
          if footer_end not in html:
              raise SystemExit('Footer not found; no change made.')

          html = html.replace(
              footer_end,
              footer_end + '<div class="iranianchat-bac3-footer" aria-hidden="true"></div>',
              1,
          )

          path.write_text(html, encoding="utf-8")
          PY

      - name: Commit homepage only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- .github/workflows/chatiha-login-fix.yml
          git add index.html
          git diff --cached --quiet || (git commit -m "fix: place bac3 at bottom of IranianChat page" && git push)
