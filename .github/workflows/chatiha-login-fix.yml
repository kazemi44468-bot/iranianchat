name: Chatiha Login Fix
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore login and registration screen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('chatiha/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("url('../assets/images/bg-body.png')", "url('../assets/images/fback.png')")
          if 'id="authGate"' not in s:
              css='''<style id="chatiha-auth-style">
          .auth-gate{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:22px;background:linear-gradient(135deg,#f7fbff,#eef6ff 48%,#f8fbff);overflow:auto}.auth-gate:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#2478ef0b 1px,transparent 1px),linear-gradient(90deg,#2478ef0b 1px,transparent 1px);background-size:34px 34px}.auth-orb{position:absolute;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,#69b8ff35,transparent 66%);top:-100px;right:-90px}.auth-orb2{position:absolute;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,#20c7c92b,transparent 68%);bottom:-120px;left:-80px}.auth-card{position:relative;width:min(960px,100%);min-height:590px;display:grid;grid-template-columns:1fr 1.02fr;background:#ffffffee;border:1px solid #dce8f4;border-radius:30px;box-shadow:0 28px 80px #315c8820;overflow:hidden;backdrop-filter:blur(18px)}.auth-visual{padding:42px;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(145deg,#edf7ff,#f9fcff);border-left:1px solid #e1ebf4;position:relative}.auth-logo{width:74px;height:74px;border-radius:22px;overflow:hidden;box-shadow:0 16px 32px #2478ef30;margin-bottom:22px}.auth-logo img{width:100%;height:100%;object-fit:cover}.auth-visual h1{font-size:31px;margin:0 0 9px}.auth-visual h1 span{color:#2478ef}.auth-visual p{font-size:12px;line-height:2;color:#718198;max-width:360px;margin:0 0 22px}.auth-features{display:grid;gap:9px}.auth-feature{display:flex;align-items:center;gap:9px;padding:10px 12px;background:#ffffffc9;border:1px solid #dfeaf4;border-radius:13px;font-size:10px}.auth-feature i{font-style:normal;width:28px;height:28px;border-radius:9px;background:#edf5ff;color:#2478ef;display:grid;place-items:center}.auth-form{padding:42px;display:flex;flex-direction:column;justify-content:center}.auth-tabs{display:grid;grid-template-columns:1fr 1fr;background:#f1f5f9;padding:4px;border-radius:13px;margin-bottom:22px}.auth-tab{padding:10px;border-radius:10px;background:transparent;color:#718198;font-size:11px}.auth-tab.active{background:#fff;color:#2478ef;font-weight:700;box-shadow:0 5px 16px #315c8810}.auth-title{font-size:23px;margin:0 0 5px}.auth-sub{font-size:9px;color:#718198;margin:0 0 20px}.auth-field{margin-bottom:11px}.auth-field label{display:block;font-size:9px;font-weight:700;margin-bottom:5px}.auth-field input{width:100%;height:46px;border:1px solid #dce6ef;border-radius:12px;background:#f8fafc;padding:0 12px;outline:0;font-size:11px}.auth-field input:focus{border-color:#9ec6fa;background:#fff;box-shadow:0 0 0 4px #2478ef0c}.auth-submit{width:100%;height:47px;border-radius:12px;background:linear-gradient(135deg,#2478ef,#65b5ff);color:#fff;font-size:11px;font-weight:700;box-shadow:0 12px 24px #2478ef25;margin-top:3px}.auth-note{text-align:center;font-size:8px;color:#8a98a9;line-height:1.9;margin:12px 0 0}.auth-switch{margin-top:13px;text-align:center;font-size:9px;color:#718198}.auth-switch button{background:none;color:#2478ef;font-size:9px;font-weight:700;padding:0}.auth-form .register-only{display:none}.auth-gate.register .register-only{display:block}.auth-gate.register .login-only{display:none}.auth-gate.register .auth-title:after{content:"ایجاد حساب کاربری"}.auth-gate.register .auth-title{font-size:0}.auth-gate.register .auth-title:after{font-size:23px}.auth-gate.hidden{display:none}@media(max-width:760px){.auth-gate{padding:12px}.auth-card{display:block;min-height:auto;border-radius:23px}.auth-visual{padding:25px 22px 20px;border-left:0;border-bottom:1px solid #e1ebf4}.auth-logo{width:58px;height:58px;border-radius:17px;margin-bottom:12px}.auth-visual h1{font-size:23px}.auth-visual p{font-size:9px;margin-bottom:12px}.auth-features{grid-template-columns:1fr 1fr}.auth-feature{font-size:8px;padding:8px}.auth-feature:nth-child(3){display:none}.auth-form{padding:23px 20px 25px}.auth-title{font-size:20px}.auth-gate.register .auth-title:after{font-size:20px}}
          </style>'''
              html='''<section class="auth-gate" id="authGate" aria-label="ورود و ثبت نام چتی‌ها"><div class="auth-orb"></div><div class="auth-orb2"></div><div class="auth-card"><div class="auth-visual"><div class="auth-logo"><img src="../assets/images/logo.png" alt="چتی‌ها"></div><h1>به <span>چتی‌ها</span> خوش آمدید</h1><p>پیام‌رسان و شبکه ارتباطی ایرانیان؛ گفتگو، گروه، کانال، تماس و ارتباطات اجتماعی در یک فضای یکپارچه.</p><div class="auth-features"><div class="auth-feature"><i>💬</i><span>گفتگوی سریع و امن</span></div><div class="auth-feature"><i>👥</i><span>گروه‌ها و جامعه‌ها</span></div><div class="auth-feature"><i>✦</i><span>دستیار هوشمند</span></div></div></div><div class="auth-form"><div class="auth-tabs"><button class="auth-tab active" id="loginTab" type="button">ورود</button><button class="auth-tab" id="registerTab" type="button">ثبت نام</button></div><h2 class="auth-title">ورود به حساب</h2><p class="auth-sub">برای ورود، شماره موبایل و رمز عبور خود را وارد کنید.</p><form id="authForm"><div class="auth-field"><label>شماره موبایل</label><input type="tel" id="authPhone" inputmode="tel" placeholder="۰۹۱۲۱۲۳۴۵۶۷" required></div><div class="auth-field register-only"><label>نام و نام خانوادگی</label><input type="text" id="authName" placeholder="نام شما"></div><div class="auth-field"><label>رمز عبور</label><input type="password" id="authPassword" placeholder="رمز عبور" required></div><div class="auth-field register-only"><label>تکرار رمز عبور</label><input type="password" id="authPassword2" placeholder="تکرار رمز عبور"></div><button class="auth-submit" type="submit">ورود به چتی‌ها</button></form><p class="auth-note">با ورود یا ثبت نام، شرایط استفاده و حریم خصوصی چتی‌ها را می‌پذیرید.</p><div class="auth-switch"><span id="switchText">حساب ندارید؟</span> <button type="button" id="switchBtn">ثبت نام کنید</button></div></div></div></section>'''
              js='''<script id="chatiha-auth-script">(function(){const g=document.getElementById('authGate'),lt=document.getElementById('loginTab'),rt=document.getElementById('registerTab'),sw=document.getElementById('switchBtn'),st=document.getElementById('switchText'),form=document.getElementById('authForm');if(!g||!form)return;function mode(register){g.classList.toggle('register',register);lt.classList.toggle('active',!register);rt.classList.toggle('active',register);st.textContent=register?'حساب دارید؟':'حساب ندارید؟';sw.textContent=register?'وارد شوید':'ثبت نام کنید';form.querySelector('.auth-submit').textContent=register?'ساخت حساب و ورود':'ورود به چتی‌ها';document.querySelector('.auth-sub').textContent=register?'اطلاعات خود را وارد کنید تا حساب چتی‌ها ساخته شود.':'برای ورود، شماره موبایل و رمز عبور خود را وارد کنید.'}lt.onclick=()=>mode(false);rt.onclick=()=>mode(true);sw.onclick=()=>mode(!g.classList.contains('register'));form.onsubmit=function(e){e.preventDefault();if(g.classList.contains('register')&&document.getElementById('authPassword').value!==document.getElementById('authPassword2').value){alert('تکرار رمز عبور صحیح نیست.');return}g.classList.add('hidden');document.body.classList.add('authenticated');if(window.toast)window.toast(g.classList.contains('register')?'حساب شما ایجاد شد':'خوش آمدید');};})();</script>'''
              s=s.replace('</head>',css+'</head>',1)
              s=s.replace('<body>','<body>'+html,1)
              s=s.replace('</body>',js+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chatiha/index.html
          git diff --cached --quiet || (git commit -m "feat(chatiha): restore login and registration screen" && git push)
