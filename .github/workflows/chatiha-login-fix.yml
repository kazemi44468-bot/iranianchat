name: Chatiha Login Fix
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore original login page and add bac3
        run: |
          git show 87406635bdc8036935c70d815dbde6b373695503:chatiha/index.html > chatiha/index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('chatiha/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("url('../assets/images/bg-body.png')", "url('../assets/images/fback.png')")
          style='''<style id="chatiha-bac3-style">.auth-bac3{display:block;width:484px;height:46px;max-width:none;flex:0 0 auto;object-fit:contain;margin:0 auto}.auth-gate{flex-direction:column;gap:0}.auth-gate .auth-bac3{position:relative;z-index:2}@media(max-width:520px){.auth-gate{overflow-x:auto}.auth-bac3{width:484px;height:46px}}</style>'''
          if 'id="chatiha-bac3-style"' not in s:
              s=s.replace('</head>',style+'</head>',1)
          top='<img class="auth-bac3" src="../assets/images/bac3.png" alt="">'
          marker='<div class="auth-orb2"></div>'
          if 'class="auth-bac3"' not in s:
              s=s.replace(marker,marker+top,1)
              s=s.replace('</div></section>', '</div>'+ '<img class="auth-bac3" src="../assets/images/bac3.png" alt="">' +'</section>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit page only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- .github/workflows/chatiha-login-fix.yml
          git add chatiha/index.html
          git diff --cached --quiet || (git commit -m "fix(chatiha): restore original login and bac3" && git push)
