name: Chatiha Login Fix
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move bac3 into the bottom of the footer only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          html = re.sub(r'<div class="iranianchat-bac3-footer" aria-hidden="true"></div>', '', html)
          footer_end = '</footer>'
          if footer_end not in html:
              raise SystemExit('Footer not found; no change made.')
          html = html.replace(footer_end, '<div class="iranianchat-bac3-footer" aria-hidden="true"></div>' + footer_end, 1)
          path.write_text(html, encoding='utf-8')
          PY
      - name: Commit homepage only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- .github/workflows/chatiha-login-fix.yml
          git add index.html
          git diff --cached --quiet || (git commit -m "fix: place bac3 inside footer bottom" && git push)
