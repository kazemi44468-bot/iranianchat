name: Chatiha Login Fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Restore login page and apply requested visual patch
        run: |
          git fetch --no-tags --depth=50 origin main
          git show 4e9e5c0fe3749b8c8f446bc31ac8507c307b8d62:chatiha/index.html > chatiha/index.html

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("chatiha/index.html")
          html = path.read_text(encoding="utf-8")

          style = """<style id="chatiha-bac3-style">
          html,
          body {
            width: 100%;
            height: 100%;
            overflow: hidden;
          }

          .auth-gate {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100svh;
            min-height: 0;
            padding: 0;
            overflow: hidden;
            justify-content: space-between;
            flex-direction: column;
            gap: 0;
            background-image:
              linear-gradient(rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0.85)),
              url('../assets/images/b1.png'),
              linear-gradient(135deg, #f7fbff, #eef6ff 48%, #f8fbff);
            background-repeat: repeat, repeat, repeat;
            background-position: left top, left top, left top;
            background-size: auto, 200px 103px, auto;
          }

          .auth-card {
            flex: 0 1 auto;
            max-height: calc(100svh - 92px);
            overflow: auto;
          }

          .auth-bac3 {
            display: block;
            width: 100%;
            height: 46px;
            min-height: 46px;
            flex: 0 0 46px;
            background-image: url('../assets/images/bac3.png');
            background-repeat: repeat-x;
            background-position: center top;
            background-size: 484px 46px;
          }

          .auth-bac3.bottom {
            transform: rotate(180deg);
          }

          .auth-gate .auth-bac3 {
            position: relative;
            z-index: 2;
          }

          @media (max-width: 760px) {
            .auth-gate {
              padding: 0;
            }

            .auth-card {
              max-height: calc(100svh - 92px);
            }
          }

          @media (max-width: 520px) {
            .auth-bac3 {
              background-size: 484px 46px;
            }
          }
          </style>"""

          if 'id="chatiha-bac3-style"' in html:
              html = re.sub(
                  r'<style id="chatiha-bac3-style">.*?</style>',
                  style,
                  html,
                  count=1,
                  flags=re.S,
              )
          else:
              html = html.replace("</head>", style + "</head>", 1)

          html = re.sub(
              r'<img class="auth-bac3" src="\.\./assets/images/bac3\.png" alt="">',
              "",
              html,
          )

          marker = '<div class="auth-orb2"></div>'
          top = '<div class="auth-bac3" aria-hidden="true"></div>'
          bottom = '<div class="auth-bac3 bottom" aria-hidden="true"></div>'

          if top not in html:
              html = html.replace(marker, marker + top, 1)

          if bottom not in html:
              html = html.replace("</section>", bottom + "</section>", 1)

          path.write_text(html, encoding="utf-8")

          root = Path("index.html")
          root_html = root.read_text(encoding="utf-8")
          root_html = root_html.replace(
              '</div><div class="iranianchat-bac3-footer"',
              '<div class="iranianchat-bac3-footer"',
              1,
          )

          root_style = """<style id="iranianchat-footer-typography">
          .footer {
            position: relative !important;
            padding-bottom: 68px !important;
            overflow: hidden !important;
          }

          .iranianchat-bac3-footer {
            position: absolute !important;
            right: 0 !important;
            bottom: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 46px !important;
            min-height: 46px !important;
            margin: 0 !important;
            padding: 0 !important;
            background-image: url('assets/images/bac3.png') !important;
            background-repeat: repeat-x !important;
            background-position: center bottom !important;
            background-size: 484px 46px !important;
            transform: none !important;
            z-index: 2 !important;
            pointer-events: none !important;
          }

          .footer-brand {
            font-size: 19px !important;
            line-height: 1.7 !important;
          }

          .footer-desc {
            font-size: 13px !important;
            line-height: 2 !important;
          }

          .footer-col h4 {
            font-size: 15px !important;
            line-height: 1.8 !important;
            margin-bottom: 10px !important;
          }

          .footer-col a {
            font-size: 13px !important;
            line-height: 2 !important;
          }

          .footer-bottom {
            font-size: 12px !important;
            line-height: 1.9 !important;
          }

          .footer-bottom small,
          .footer-bottom span {
            font-size: 12px !important;
            line-height: 1.9 !important;
          }

          @media (max-width: 760px) {
            .footer {
              padding-bottom: 68px !important;
            }

            .footer-brand {
              font-size: 17px !important;
            }

            .footer-desc {
              font-size: 12px !important;
            }

            .footer-col h4 {
              font-size: 14px !important;
            }

            .footer-col a {
              font-size: 12px !important;
              line-height: 1.95 !important;
            }

            .footer-bottom,
            .footer-bottom small,
            .footer-bottom span {
              font-size: 11px !important;
              line-height: 1.9 !important;
            }
          }

          @media (max-width: 420px) {
            .footer-brand {
              font-size: 16px !important;
            }

            .footer-desc,
            .footer-col a {
              font-size: 11px !important;
            }

            .footer-col h4 {
              font-size: 13px !important;
            }

            .footer-bottom,
            .footer-bottom small,
            .footer-bottom span {
              font-size: 10.5px !important;
            }
          }
          </style>"""

          if 'id="iranianchat-footer-typography"' in root_html:
              root_html = re.sub(
                  r'<style id="iranianchat-footer-typography">.*?</style>',
                  root_style,
                  root_html,
                  count=1,
                  flags=re.S,
              )
          else:
              root_html = root_html.replace("</head>", root_style + "</head>", 1)

          root.write_text(root_html, encoding="utf-8")
          PY

      - name: Format HTML, CSS and JavaScript for readability
        run: |
          npx --yes js-beautify@1.15.4 --type html --indent-size 2 --end-with-newline -r chatiha/index.html
          npx --yes js-beautify@1.15.4 --type html --indent-size 2 --end-with-newline -r index.html

      - name: Commit page only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- .github/workflows/chatiha-login-fix.yml
          git add chatiha/index.html index.html
          git diff --cached --quiet || (git commit -m "fix(ui): anchor footer decoration and normalize typography" && git push)
