name: Chatiha Login Fix
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore original login page and add bac3
        run: |
          git fetch --no-tags --depth=50 origin main
          git show 4e9e5c0fe3749b8c8f446bc31ac8507c307b8d62:chatiha/index.html > chatiha/index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('chatiha/index.html')
          s=p.read_text(encoding='utf-8')
          style='''<style id="chatiha-bac3-style">.auth-bac3{display:block;width:100%;height:46px;flex:0 0 46px;background-image:url('../assets/images/bac3.png');background-repeat:repeat-x;background-position:center top;background-size:484px 46px}.auth-bac3.bottom{transform:rotate(180deg)}.auth-gate{flex-direction:column;gap:0}.auth-gate .auth-bac3{position:relative;z-index:2}@media(max-width:520px){.auth-bac3{background-size:484px 46px}}</style>'''
          if 'id="chatiha-bac3-style"' in s:
              import re
              s=re.sub(r'<style id="chatiha-bac3-style">.*?</style>',style,s,count=1,flags=re.S)
          else:
              s=s.replace('</head>',style+'</head>',1)
          import re
          s=re.sub(r'<img class="auth-bac3" src="\.\./assets/images/bac3\.png" alt="">','',s)
          marker='<div class="auth-orb2"></div>'
          top='<div class="auth-bac3" aria-hidden="true"></div>'
          bottom='<div class="auth-bac3 bottom" aria-hidden="true"></div>'
          s=s.replace(marker,marker+top,1)
          s=s.replace('</section>',bottom+'</section>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit page only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- .github/workflows/chatiha-login-fix.yml
          git add chatiha/index.html
          git diff --cached --quiet || (git commit -m "fix(chatiha): tile bac3 without resizing" && git push)
