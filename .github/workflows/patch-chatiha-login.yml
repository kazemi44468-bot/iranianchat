name: Patch Chatiha demo login
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-chatiha-login.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch login handler
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('chatiha/index.html')
          s=p.read_text(encoding='utf-8')
          old="$('#login').onsubmit=e=>{e.preventDefault();hideError();const user=$('#loginUser').value.trim().toLowerCase(),pass=$('#loginPass').value,found=getUsers().find(x=>x.user===user&&x.pass===pass);if(!found){const demo=(user==='demo'&&pass==='123456');if(demo){currentUser={name:'کاربر نمونه',user:'demo',phone:'09120000000'}}else return showError('نام کاربری یا رمز عبور صحیح نیست. برای ورود ابتدا ثبت‌نام کنید.')}else currentUser=found;openApp()};"
          new="$('#login').onsubmit=e=>{e.preventDefault();hideError();const user=$('#loginUser').value.trim(),pass=$('#loginPass').value;if(!user&&!pass)return showError('برای ورود، نام کاربری یا رمز عبور را وارد کنید.');currentUser={name:user||'کاربر چتی‌ها',user:user||'guest',phone:'',pass};openApp()};"
          if old not in s:
              raise SystemExit('Target login handler was not found; no changes made.')
          s=s.replace(old,new,1)
          s=s.replace('برای حساب‌های ثبت‌شده، ورود با نام کاربری و رمز عبور انجام می‌شود.','در نسخه نمایشی، هر نام کاربری و رمز عبوری برای ورود پذیرفته می‌شود.')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chatiha/index.html
          git rm .github/workflows/patch-chatiha-login.yml
          git commit -m 'Make Chatiha demo login accept any credentials'
          git push