name: Integrate Chatiha Workspaces
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate internal workspaces
        shell: python
        run: |
          from pathlib import Path
          p=Path('chatiha/index.html')
          s=p.read_text(encoding='utf-8')
          old=".main{display:flex;flex-direction:column;min-width:0;background:#f7f9fc}"
          new=".main{display:flex;flex-direction:column;min-width:0;background:#f7f9fc;position:relative;overflow:hidden}"
          s=s.replace(old,new)
          start=s.find('.view{display:none;position:fixed;')
          end=s.find('.view.open{display:block}',start)
          if start!=-1 and end!=-1:
              end2=end+len('.view.open{display:block}')
              s=s[:start]+".view{display:none;position:absolute;inset:0;background:var(--bg);z-index:20;box-shadow:none;overflow:hidden}.view.open{display:block}"+s[end2:]
          s=s.replace(".view{right:364px;left:0}",".view{inset:0}")
          s=s.replace(".view{right:321px;left:0}",".view{inset:0}")
          s=s.replace(".view{right:0;left:0;box-shadow:none}",".view{inset:0;box-shadow:none}")
          s=s.replace(".viewbody{padding:20px;overflow:auto;height:calc(100% - 68px);background:linear-gradient(180deg,#f8faff 0,#f5f8fc 100%)}", ".viewbody{padding:22px;overflow:auto;height:calc(100% - 68px);background:#f6f9fd}.viewbody .cards{max-width:1120px;margin:0 auto}.viewbody:before{content:'';display:block;height:1px}")
          marker="</script></body></html>"
          extra=r'''<script>
(function(){
const rich={
 social:{title:'شبکه اجتماعی',sub:'جامعه، محتوا و ارتباطات عمومی',html:`<div class="richhero"><div><span class="eyebrow">فضای اجتماعی</span><h3>ارتباطات خود را یک‌جا مدیریت کنید</h3><p>استوری، کانال، صفحه عمومی، گروه‌ها و تعاملات در یک محیط یکپارچه.</p></div><button onclick="toast('ایجاد محتوای جدید')">ایجاد محتوا</button></div><div class="richgrid"><div class="richcard"><div class="richicon">است</div><b>استوری‌ها</b><small>۱۲ استوری جدید از دوستان و صفحات</small><div class="storyrow"><i>س</i><i>م</i><i>ک</i><i>+</i></div></div><div class="richcard"><div class="richicon">کان</div><b>کانال‌های منتخب</b><small>اخبار، آموزش و محتوای تخصصی</small><div class="minirow"><strong>اخبار فناوری</strong><span>۱۲.۴K</span></div><div class="minirow"><strong>اساتید و پژوهشگران</strong><span>۸.۷K</span></div></div><div class="richcard"><div class="richicon">گرو</div><b>گروه‌های من</b><small>گفتگوهای فعال اجتماعی</small><div class="minirow"><strong>تیم محصول</strong><span>۱۲ عضو</span></div><div class="minirow"><strong>جامعه طراحان</strong><span>۲۴۸ عضو</span></div></div></div>`},
 calls:{title:'تماس‌ها',sub:'ارتباط صوتی و تصویری',html:`<div class="richhero"><div><span class="eyebrow">ارتباط زنده</span><h3>تماس را سریع و حرفه‌ای شروع کنید</h3><p>تماس صوتی، تصویری و جلسه‌های گروهی با سابقه تماس‌های یکپارچه.</p></div><button onclick="toast('تماس جدید آماده است')">تماس جدید</button></div><div class="richgrid"><div class="richcard"><div class="richicon">صوت</div><b>تماس صوتی</b><small>تماس سریع با مخاطبین و گروه‌ها</small><button class="softbtn" onclick="toast('انتخاب مخاطب')">انتخاب مخاطب</button></div><div class="richcard"><div class="richicon">تص</div><b>تماس تصویری</b><small>جلسه تصویری فردی یا گروهی</small><button class="softbtn" onclick="toast('ساخت جلسه تصویری')">ساخت جلسه</button></div><div class="richcard"><div class="richicon">اخیر</div><b>تماس‌های اخیر</b><small>آخرین ارتباطات شما</small><div class="minirow"><strong>سارا احمدی</strong><span>امروز · ۰۹:۱۸</span></div><div class="minirow"><strong>تیم محصول</strong><span>دیروز · ۱۶:۴۲</span></div></div></div>`},
 files:{title:'فایل‌ها',sub:'مرکز اسناد و رسانه',html:`<div class="richhero"><div><span class="eyebrow">مرکز فایل</span><h3>همه فایل‌های گفتگوهای شما</h3><p>تصویر، ویدئو، سند و لینک را سریع پیدا کنید و دوباره به اشتراک بگذارید.</p></div><button onclick="toast('انتخاب فایل برای بارگذاری')">بارگذاری فایل</button></div><div class="richgrid"><div class="richcard"><div class="richicon">رسانه</div><b>تصاویر و ویدئو</b><small>۴۲۸ فایل رسانه‌ای</small><button class="softbtn" onclick="toast('رسانه‌ها نمایش داده شد')">مشاهده</button></div><div class="richcard"><div class="richicon">سند</div><b>اسناد کاری</b><small>۱۸۴ سند و فایل متنی</small><button class="softbtn" onclick="toast('اسناد نمایش داده شد')">مشاهده</button></div><div class="richcard"><div class="richicon">لینک</div><b>لینک‌های ذخیره‌شده</b><small>۹۶ لینک از گفتگوها</small><button class="softbtn" onclick="toast('لینک‌ها نمایش داده شد')">مشاهده</button></div></div>`},
 org:{title:'فضای سازمانی',sub:'همکاری، پروژه و فرآیند',html:`<div class="richhero"><div><span class="eyebrow">محیط سازمانی</span><h3>کار تیمی را از گفتگو تا اجرا مدیریت کنید</h3><p>سازمان‌ها، تیم‌ها، پروژه‌ها، جلسه‌ها، فرم‌ها و گزارش‌ها در یک فضای یکپارچه.</p></div><button onclick="toast('ایجاد فضای کاری')">فضای جدید</button></div><div class="richgrid"><div class="richcard"><div class="richicon">تیم</div><b>تیم‌های فعال</b><small>۶ تیم در حال همکاری</small><div class="progress"><i style="width:76%"></i></div><small>پیشرفت کلی ۷۶٪</small></div><div class="richcard"><div class="richicon">پرو</div><b>پروژه‌ها</b><small>۱۴ پروژه فعال</small><div class="minirow"><strong>راه‌اندازی محصول</strong><span>۸۲٪</span></div><div class="minirow"><strong>وب‌سایت سازمان</strong><span>۶۴٪</span></div></div><div class="richcard"><div class="richicon">جلس</div><b>جلسه و گردش کار</b><small>۳ جلسه امروز · ۵ فرم در انتظار</small><button class="softbtn" onclick="toast('تقویم سازمانی')">مشاهده برنامه</button></div></div>`},
 ai:{title:'دستیار هوشمند',sub:'هوش مصنوعی در دل چتی‌ها',html:`<div class="richhero aihero"><div><span class="eyebrow">دستیار هوشمند</span><h3>از گفتگو، تصمیم و کار قابل اجرا بسازید</h3><p>خلاصه‌سازی، جست‌وجوی معنایی، استخراج وظایف و دستیار سازمانی در کنار شماست.</p></div><button onclick="toast('دستیار هوشمند فعال شد')">شروع گفتگو با دستیار</button></div><div class="richgrid"><div class="richcard"><div class="richicon">خلاصه</div><b>خلاصه گفتگو</b><small>جمع‌بندی فوری گفتگوهای طولانی</small><button class="softbtn" onclick="toast('خلاصه در حال آماده‌سازی است')">خلاصه کن</button></div><div class="richcard"><div class="richicon">جستجو</div><b>جست‌وجوی هوشمند</b><small>یافتن تصمیم، فایل و فرد با زبان طبیعی</small><button class="softbtn" onclick="toast('جست‌وجوی هوشمند آماده است')">جست‌وجو</button></div><div class="richcard"><div class="richicon">کارها</div><b>استخراج کارها</b><small>تشخیص وظایف، مسئول و موعد از گفتگو</small><button class="softbtn" onclick="toast('۴ کار از گفتگو استخراج شد')">استخراج کار</button></div></div>`},
 settings:{title:'تنظیمات و پروفایل',sub:'هویت، امنیت و شخصی‌سازی',html:`<div class="settingshero"><div class="settingavatar">ع</div><div><span class="eyebrow">حساب کاربری</span><h3>پروفایل و امنیت چتی‌ها</h3><p>اطلاعات هویتی، حریم خصوصی، اعلان‌ها و دستگاه‌های فعال را مدیریت کنید.</p></div><button onclick="toast('پروفایل ذخیره شد')">ذخیره تغییرات</button></div><div class="settingsgrid"><div class="settingcard"><b>اطلاعات پروفایل</b><label>نام نمایشی<input value="علی کاربر"></label><label>نام کاربری<input value="@user"></label><label>وضعیت<input value="آماده گفتگو"></label></div><div class="settingcard"><b>حریم خصوصی و امنیت</b><div class="settingline"><span>تأیید شماره موبایل<small>حساب تأییدشده</small></span><em>فعال</em></div><div class="settingline"><span>نشست‌های فعال<small>۳ دستگاه متصل</small></span><button onclick="toast('نشست‌های فعال')">مدیریت</button></div><div class="settingline"><span>نمایش وضعیت آنلاین<small>کنترل برای مخاطبین</small></span><em>فعال</em></div></div></div>`}
};
const css=`<style>.richhero{display:flex;align-items:center;justify-content:space-between;gap:20px;max-width:1120px;margin:0 auto 16px;padding:24px;border:1px solid #dfe7f1;border-radius:22px;background:#fff;box-shadow:0 10px 28px rgba(35,58,90,.06)}.richhero h3,.settingshero h3{margin:7px 0 5px;font-size:21px}.richhero p,.settingshero p{margin:0;color:#718096;font-size:11px;line-height:2;max-width:720px}.richhero button,.settingshero button{background:#246bfe;color:#fff;border-radius:12px;padding:11px 16px;white-space:nowrap;font-size:10px}.eyebrow{font-size:9px;color:#246bfe;font-weight:700}.richgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;max-width:1120px;margin:auto}.richcard{background:#fff;border:1px solid #dfe7f1;border-radius:18px;padding:18px;min-height:180px;box-shadow:0 7px 22px rgba(35,58,90,.05)}.richicon{width:45px;height:45px;border-radius:13px;background:#edf3ff;color:#246bfe;display:grid;place-items:center;font-size:9px;font-weight:700;margin-bottom:13px}.richcard b{display:block;font-size:13px}.richcard small{display:block;color:#718096;font-size:9px;line-height:1.9;margin-top:4px}.storyrow{display:flex;gap:6px;margin-top:15px}.storyrow i{width:32px;height:32px;border-radius:50%;background:#edf3ff;color:#246bfe;display:grid;place-items:center;font-size:9px;font-style:normal}.minirow{display:flex;justify-content:space-between;gap:8px;border-top:1px solid #edf1f5;padding:9px 0 0;margin-top:9px;font-size:9px}.minirow span{color:#8a97a7}.softbtn{margin-top:14px;border:1px solid #d7e3f6;background:#f5f8fc;color:#246bfe;border-radius:10px;padding:8px 12px;font-size:9px}.progress{height:7px;background:#eef2f7;border-radius:99px;margin-top:14px;overflow:hidden}.progress i{display:block;height:100%;background:#246bfe;border-radius:99px}.settingshero{display:flex;align-items:center;gap:14px;max-width:1120px;margin:auto auto 14px;padding:20px;background:#fff;border:1px solid #dfe7f1;border-radius:20px}.settingavatar{width:58px;height:58px;border-radius:18px;background:#edf3ff;color:#246bfe;display:grid;place-items:center;font-size:22px;font-weight:700}.settingshero>div:nth-child(2){flex:1}.settingsgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px;max-width:1120px;margin:auto}.settingcard{background:#fff;border:1px solid #dfe7f1;border-radius:18px;padding:18px}.settingcard>b{font-size:13px;display:block;margin-bottom:14px}.settingcard label{display:block;font-size:9px;font-weight:700;margin-bottom:10px}.settingcard input{display:block;width:100%;height:42px;margin-top:5px;border:1px solid #dfe7f1;border-radius:10px;background:#f8fafc;padding:0 10px;outline:0}.settingline{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid #edf1f5;font-size:10px}.settingline small{display:block;color:#718096;font-size:8px;margin-top:3px}.settingline em{font-style:normal;color:#20a779;background:#edf9f4;border-radius:99px;padding:5px 8px;font-size:8px}.settingline button{border:0;background:#edf3ff;color:#246bfe;border-radius:9px;padding:6px 9px;font-size:8px}@media(max-width:760px){.richhero,.settingshero{align-items:flex-start;flex-direction:column}.richgrid,.settingsgrid{grid-template-columns:1fr}.richhero h3,.settingshero h3{font-size:17px}.viewbody{padding:12px}}</style>`;
document.head.insertAdjacentHTML('beforeend',css);
const originalOpen=window.openView;window.openView=function(k){originalOpen(k);if(rich[k]){document.getElementById('viewTitle').textContent=rich[k].title;document.getElementById('viewBody').innerHTML=rich[k].html;}};
})();
</script>'''
          if 'const rich={' not in s:
              s=s.replace(marker,extra+marker)
          p.write_text(s,encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chatiha/index.html
          git diff --cached --quiet || (git commit -m "feat(chatiha): integrate and enrich internal workspaces" && git push)
