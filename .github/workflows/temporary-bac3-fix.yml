name: Temporary bac3 placement fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix only bac3 placement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='''  <style id="iranianchat-bac3-footer-style">\n    .iranianchat-bac3-footer {\n      width: 100%;\n      height: 46px;\n      min-height: 46px;\n      display: block;\n      background-image: url('assets/images/bac3.png');\n      background-repeat: repeat-x;\n      background-position: center top;\n      background-size: 484px 46px;\n      transform: rotate(180deg);\n      transform-origin: center;\n    }\n\n  </style>'''
          new='''  <style id="iranianchat-bac3-footer-style">\n    .iranianchat-bac3-footer {\n      position: absolute;\n      right: 0;\n      bottom: 0;\n      left: 0;\n      width: 100%;\n      height: 46px;\n      min-height: 46px;\n      display: block;\n      margin: 0;\n      padding: 0;\n      background-image: url('assets/images/bac3.png');\n      background-repeat: repeat-x;\n      background-position: center top;\n      background-size: 484px 46px;\n      transform: rotate(180deg);\n      transform-origin: center center;\n      pointer-events: none;\n    }\n\n  </style>'''
          if old in s:
              s=s.replace(old,new,1)
          marker='<div class="iranianchat-bac3-footer" aria-hidden="true"></div>'
          s=s.replace(marker,'',1)
          needle='''<span class="footer-company">راه‌اندازی و توسعه توسط <a href="https://zbhf.ir" target="_blank" rel="noopener noreferrer">زیست‌بوم هوشمند فناوری</a></span>\n        \n  </footer>'''
          repl='''<span class="footer-company">راه‌اندازی و توسعه توسط <a href="https://zbhf.ir" target="_blank" rel="noopener noreferrer">زیست‌بوم هوشمند فناوری</a></span></div>\n        \n  <div class="iranianchat-bac3-footer" aria-hidden="true"></div></footer>'''
          if needle in s:
              s=s.replace(needle,repl,1)
          else:
              raise SystemExit('footer anchor not found')
          p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/temporary-bac3-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@github.com'
          git add index.html .github/workflows/temporary-bac3-fix.yml
          git diff --cached --quiet || (git commit -m 'fix: place bac3 at footer bottom' && git push)
