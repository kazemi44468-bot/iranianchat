name: One-time Contact Gallery Logo Update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update only requested homepage and Chatiha elements
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('index.html')
          h = root.read_text(encoding='utf-8')
          if 'id="iranianchat-contact-gallery"' not in h:
              style = '''\n<style id="iranianchat-contact-gallery-style">\n.iranianchat-contact-gallery{padding:26px 0 70px}.iranianchat-contact-gallery .section-head{text-align:center;margin-bottom:20px}.iranianchat-contact-gallery .section-head h2{margin:0 0 7px;font-size:28px}.iranianchat-contact-gallery .section-head p{margin:0;color:var(--muted);font-size:13px}.iranianchat-gallery-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.iranianchat-gallery-card{position:relative;overflow:hidden;border:1px solid #dce8f4;background:#ffffffe8;border-radius:22px;box-shadow:0 18px 45px #24527b12}.iranianchat-gallery-card img{display:block;width:100%;height:220px;object-fit:cover}.iranianchat-gallery-card .caption{padding:12px 14px;font-size:11px;font-weight:700;color:var(--ink)}.iranianchat-contact{margin-top:22px;padding:22px;border:1px solid #dce8f4;border-radius:22px;background:linear-gradient(135deg,#fff,#f4f9ff);box-shadow:0 18px 45px #24527b12}.iranianchat-contact-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:12px}.iranianchat-contact-item{padding:14px;border:1px solid #e1eaf3;border-radius:15px;background:#fff}.iranianchat-contact-item b{display:block;font-size:12px;margin-bottom:4px}.iranianchat-contact-item span,.iranianchat-contact-item a{font-size:10px;color:var(--muted)}.iranianchat-contact-item a{color:var(--blue)}.iranianchat-brand-img{width:49px;height:49px;display:block;object-fit:cover;border-radius:16px;box-shadow:0 11px 28px #2478ef3b}.iranianchat-header-brand{display:flex;align-items:center;gap:10px}.iranianchat-header-brand .iranianchat-brand-img{flex:none}\n@media(max-width:800px){.iranianchat-gallery-grid,.iranianchat-contact-grid{grid-template-columns:1fr}.iranianchat-gallery-card img{height:190px}.iranianchat-contact{padding:16px}}\n</style>\n'''
              h = h.replace('</head>', style + '</head>', 1)
          old = '<a class="brand" href="#top"><i class="logo"></i><span>ایرانیان چت<small>پیام‌رسان سریع، امن و هوشمند</small></span></a>'
          new = '<a class="brand iranianchat-header-brand" href="./" aria-label="صفحه اصلی ایرانیان چت"><img class="iranianchat-brand-img" src="assets/images/logo.png" alt="ایرانیان چت"><span>ایرانیان چت<small>پیام‌رسان سریع، امن و هوشمند</small></span></a>'
          h = h.replace(old, new, 1)
          if 'id="iranianchat-contact-gallery"' not in h:
              section = '''<section class="iranianchat-contact-gallery" id="iranianchat-contact-gallery"><div class="wrap"><div class="section-head"><h2>چهره‌ای از ایرانیان چت</h2><p>فضایی برای ارتباط، گفتگو و ساخت جامعه‌های دیجیتال ایرانی.</p></div><div class="iranianchat-gallery-grid"><article class="iranianchat-gallery-card"><img src="assets/images/pic1.png" alt="ایرانیان چت"><div class="caption">ارتباطات مدرن و یکپارچه</div></article><article class="iranianchat-gallery-card"><img src="assets/images/pic2.png" alt="چتی‌ها"><div class="caption">گفتگو و جامعه‌های آنلاین</div></article><article class="iranianchat-gallery-card"><img src="assets/images/pic3.png" alt="پیام‌رسان ایرانیان چت"><div class="caption">تجربه‌ای برای کاربران و سازمان‌ها</div></article></div><div class="iranianchat-contact" id="contact"><div class="section-head"><h2>تماس با ما</h2><p>برای همکاری، توسعه نسخه اختصاصی یا دریافت اطلاعات بیشتر با ما در ارتباط باشید.</p></div><div class="iranianchat-contact-grid"><div class="iranianchat-contact-item"><b>وب‌سایت چتی‌ها</b><a href="https://chatiha.ir" target="_blank" rel="noopener noreferrer">chatiha.ir</a></div><div class="iranianchat-contact-item"><b>ایمیل همکاری</b><a href="mailto:support@chatiha.ir">support@chatiha.ir</a></div><div class="iranianchat-contact-item"><b>پشتیبانی</b><span>از داخل محیط چتی‌ها و مسیرهای ارتباطی سامانه</span></div></div></div></div></section>'''
              h = h.replace('</main>', section + '</main>', 1)
          root.write_text(h, encoding='utf-8')

          chat = Path('chatiha/index.html')
          c = chat.read_text(encoding='utf-8')
          if 'id="chatiha-brand-gallery-style"' not in c:
              style2 = '''\n<style id="chatiha-brand-gallery-style">\n.chatiha-linked-logo{display:block;width:49px;height:49px;border-radius:16px;overflow:hidden;box-shadow:0 12px 28px #2478ef38}.chatiha-linked-logo img{width:100%;height:100%;object-fit:cover}.chatiha-auth-gallery{display:flex;gap:8px;margin:14px 0 2px;max-width:420px}.chatiha-auth-gallery a{display:block;flex:1;border-radius:13px;overflow:hidden;border:1px solid #dce7f1;box-shadow:0 7px 18px #315c8810}.chatiha-auth-gallery img{display:block;width:100%;height:74px;object-fit:cover}@media(max-width:700px){.chatiha-auth-gallery img{height:58px}}\n</style>\n'''
              c = c.replace('</head>', style2 + '</head>', 1)
          c = c.replace('<div class="auth-logo"><img src="../assets/images/logo.png" alt="چتی‌ها"></div>', '<a class="auth-logo chatiha-linked-logo" href="../" aria-label="صفحه اصلی ایرانیان چت"><img src="../assets/images/logo.png" alt="چتی‌ها"></a>', 1)
          c = c.replace('<div class="brand"><img src="../assets/images/logo.png" alt="چتی‌ها"></div>', '<a class="brand chatiha-linked-logo" href="../" aria-label="صفحه اصلی ایرانیان چت"><img src="../assets/images/logo.png" alt="چتی‌ها"></a>', 1)
          if 'class="chatiha-auth-gallery"' not in c:
              gallery = '<div class="chatiha-auth-gallery" aria-label="تصاویر چتی‌ها"><a href="../assets/images/pic1.png" target="_blank"><img src="../assets/images/pic1.png" alt="چتی‌ها ۱"></a><a href="../assets/images/pic2.png" target="_blank"><img src="../assets/images/pic2.png" alt="چتی‌ها ۲"></a><a href="../assets/images/pic3.png" target="_blank"><img src="../assets/images/pic3.png" alt="چتی‌ها ۳"></a></div>'
              anchor = '<div class="auth-features">'
              c = c.replace(anchor, gallery + anchor, 1)
          chat.write_text(c, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html chatiha/index.html
          git diff --cached --quiet || git commit -m 'feat: add contact gallery and linked logos' && git push
          rm -f .github/workflows/one-time-contact-pics-logo.yml
          git add .github/workflows/one-time-contact-pics-logo.yml
          git diff --cached --quiet || (git commit -m 'chore: remove one-time update workflow' && git push)
