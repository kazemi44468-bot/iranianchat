name: Footer fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix footer logo
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='.footer-brand-mark{width:128px;height:128px;flex:none;border-radius:28px;overflow:hidden;background:#fff;border:1px solid #dbe7f2;box-shadow:0 12px 28px #24527b14}'
          new='.footer-brand-mark{width:128px;height:128px;flex:none;border-radius:0;overflow:visible;background:transparent;border:0;box-shadow:none}'
          assert s.count(old)==1
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'chore: cleanup IranianChat footer logo'
          git push
